          - heading "Curious by nature. Practical by craft." [level=2] [ref=f5e58]
        - paragraph [ref=f5e59]: I've always been drawn to how technology solves real problems. Growing up in Limpopo, I saw communities lack access to fast, reliable information during emergencies — that observation shaped my drive to build systems that help people.
      - generic [ref=f5e60]:
        - generic [ref=f5e61]:
          - paragraph [ref=f5e62]: I'm a final-year Diploma in Computer Science student at Tshwane University of Technology, with hands-on experience across software development, databases, networking, and data. I've represented my skills on national stages — winning the Huawei Developer Competition with DevRift, placing third at the WISA Hackathon and the ITWeb Security Summit hackathon with Seyabona, and completing work-integrated learning at the Data Science Academy.
          - paragraph [ref=f5e63]: "\"I am trustworthy, creative, and an effective communicator — I anticipate working in a challenging, rewarding environment to grow and contribute.\""
